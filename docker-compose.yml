services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexora
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora_demo
    ports: ["5432:5432"]
    volumes: ["nexora_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora"]
      interval: 5s
      retries: 15
  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/nexora
      DB_USER: nexora
      DB_PASSWORD: nexora_demo
      SPRING_PROFILES_ACTIVE: demo
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  nexora_pg:
